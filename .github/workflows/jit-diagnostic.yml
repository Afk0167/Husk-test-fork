
name: Husk JIT Diagnostic Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Husk IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install Meson and Ninja
        run: |
          brew install meson ninja
          meson --version
          ninja --version

      - name: Build Husk
        run: |
          chmod +x scripts/ci_build.sh
          ./scripts/ci_build.sh
      
      - name: Show GLib failure log
        if: failure()
        run: |
          if [ -f build/logs/glib-2.83.0.log ]; then
            echo "===== GLib build log (last 200 lines) ====="
            tail -n 200 build/logs/glib-2.83.0.log
          else
            echo "GLib log file not found"
            find build -iname '*glib*log' -print
          fi
      
      - name: Check IPA and Helper
        run: |
          test -f build/Husk.ipa
          ls -lh build/Husk.ipa
          unzip -l build/Husk.ipa | grep 'HuskJITHelper.appex'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-JIT-Diagnostic
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 7
